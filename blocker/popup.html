<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="platform-ui.js"></script>
  <title>BraveFox Focus Master</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-page="popup">
  <main class="popup-shell">
    <header class="topbar">
      <div class="brand-wordmark">BraveFox Focus Master</div>
      <span class="status-pill" title="Blocking remains active while Focus Master is locked">✓</span>
    </header>

    <div class="popup-content">
      <button id="openQuickBlock" class="quick-block-link" type="button" aria-label="Open Quick Block settings">
        <span class="quick-block-desktop-label">Quick Block Settings</span>
        <span class="quick-block-mobile-icon" aria-hidden="true">+</span>
        <span class="quick-block-mobile-copy">
          <strong>Quick Block</strong>
          <small>Add a term or link here, without needing to unlock settings.</small>
        </span>
        <span class="quick-block-mobile-chevron" aria-hidden="true">⌄</span>
      </button>

      <section class="lock-panel" aria-labelledby="popupTitle">
        <img class="lock-illustration" src="../icons/Locked.png" alt="Focus Master locked">

        <h1 id="popupTitle">Focus Master is locked</h1>
        <p class="subtitle subtitle-desktop">Enter password to unlock settings</p>
        <p class="subtitle subtitle-android">Enter password to unlock</p>

        <form id="unlockForm" autocomplete="off" spellcheck="false">
          <div class="input-row">
            <input id="passwordInput" type="password" autocomplete="off" placeholder="Enter password" aria-label="Enter password">
            <button id="unlockButton" type="submit" aria-label="Continue">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l7 7-7 7"/></svg>
            </button>
          </div>
          <p id="errorText" class="error" aria-live="polite"></p>
        </form>

        <p class="hint unlock-hint">The full-page password prompt appears only after the unlock period expires.</p>

        <section id="extensionUpdateArea" class="extension-update-area" aria-label="Extension updates">
          <button id="checkExtensionUpdate" class="extension-update-button" type="button">Check for updates</button>
          <p id="extensionUpdateStatus" class="extension-update-status" role="status" aria-live="polite" hidden></p>
        </section>

        <div id="redirectLoggerArea" class="redirect-logger-area" hidden>
          <button id="enableRedirectLogger" class="redirect-logger-button" type="button">Enable PC Redirect Logger</button>
          <p id="redirectLoggerStatus" class="hint redirect-logger-status" role="status" aria-live="polite"></p>
        </div>

        <p id="enhancerVersion" class="enhancer-version">Via BraveFox Enhancer</p>
      </section>
    </div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
